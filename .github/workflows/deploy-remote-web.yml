name: Deploy remote task web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remote-system/web/**"
      - ".github/workflows/deploy-remote-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: remote-system/web
        run: npm test
      - name: Build
        working-directory: remote-system/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote-system/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

